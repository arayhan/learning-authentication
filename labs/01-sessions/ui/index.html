<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 01 · Passwords &amp; Sessions</title>
<style>
  :root { --bg:#fafafa; --card:#fff; --fg:#18181b; --muted:#71717a; --line:#e4e4e7; --accent:#4f46e5; --accent-fg:#fff; --ok:#15803d; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#09090b; --card:#18181b; --fg:#fafafa; --muted:#a1a1aa; --line:#27272a; --accent:#818cf8; --accent-fg:#09090b; --ok:#4ade80; --bad:#f87171; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { margin:0 0 4px; font-size:18px; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:13px; }
  label { display:block; margin:0 0 12px; font-size:13px; color:var(--muted); }
  input { display:block; width:100%; margin-top:4px; padding:8px 10px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row { display:flex; gap:8px; margin-top:16px; }
  button { flex:1; padding:8px 12px; font:inherit; font-weight:500; cursor:pointer; color:var(--fg); background:transparent; border:1px solid var(--line); border-radius:8px; }
  button.primary { color:var(--accent-fg); background:var(--accent); border-color:var(--accent); }
  pre { margin:16px 0 0; padding:10px 12px; min-height:3em; overflow:auto; font:12px/1.5 ui-monospace, "JetBrains Mono", Consolas, monospace; background:var(--bg); border:1px solid var(--line); border-radius:8px; white-space:pre-wrap; word-break:break-all; }
  pre.ok { color:var(--ok); } pre.bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>Passwords &amp; Sessions</h1>
  <p class="sub">Lab 01. Log in, then check who the server thinks you are.</p>
  <form id="f">
    <label>Email<input id="email" type="email" autocomplete="username" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required></label>
    <div class="row">
      <button class="primary" type="submit">Log in</button>
      <button type="button" id="register">Register</button>
    </div>
    <div class="row">
      <button type="button" id="me">Who am I?</button>
      <button type="button" id="logout">Log out</button>
    </div>
  </form>
  <pre id="out" aria-live="polite">Not logged in.</pre>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let csrf = "";
  async function call(path, method, body, headers = {}) {
    const res = await fetch(path, {
      method, credentials: "same-origin",
      headers: { ...(body ? { "Content-Type": "application/json" } : {}), ...headers },
      body: body ? JSON.stringify(body) : undefined,
    });
    const text = await res.text();
    const out = $("out");
    out.className = res.ok ? "ok" : "bad";
    out.textContent = `${method} ${path} → ${res.status}\n${text}`;
    try { return { res, json: JSON.parse(text) }; } catch { return { res, json: null }; }
  }
  const creds = () => ({ email: $("email").value, password: $("password").value });
  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const { res, json } = await call("/login", "POST", creds());
    if (res.ok) csrf = json.csrfToken;
  });
  $("register").onclick = () => call("/register", "POST", creds());
  $("me").onclick = () => call("/me", "GET");
  $("logout").onclick = async () => { const { res } = await call("/logout", "POST", undefined, { "X-CSRF-Token": csrf }); if (res.ok) csrf = ""; };
</script>
</body>
</html>
